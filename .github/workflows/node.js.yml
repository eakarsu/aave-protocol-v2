name: Build and governance checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 16.20.2
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Repository security, provenance, and governance checks
        run: npm run health
      - name: Compile contracts
        run: npm run compile
      - name: Enforce deployable bytecode limits
        run: npm run verify:bytecode
      - name: Run local contract tests
        run: npm test

  # Forked-network checks require an explicit manual dispatch and protected
  # environment credentials. They are not silently treated as reproducible CI.
  mainnet-fork:
    if: github.event_name == 'workflow_dispatch'
    environment: mainnet-fork-testing
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 16.20.2
          cache: npm
      - run: npm ci
      - run: npm run aave:fork:main
        env:
          RPC_URL_MAIN: ${{ secrets.RPC_URL_MAIN }}
