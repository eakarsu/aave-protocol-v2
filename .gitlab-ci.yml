stages:
  - checks
  - publish

default:
  image: node:16.20.2-bullseye-slim
  interruptible: true
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - .npm/
  before_script:
    - npm ci --cache .npm --prefer-offline

verify:
  stage: checks
  script:
    - npm run health
    - npm run compile
    - npm run verify:bytecode
    - npm test

# External formal verification is opt-in because it installs network software
# and submits work to a third-party service. Protected variables are configured
# in GitLab, never written into the working tree.
certora-test:
  stage: checks
  image: python:3.12-slim
  before_script: []
  script:
    - echo "Run the owner-approved Certora pipeline for the pinned release commit."
  when: manual
  allow_failure: true

publish:
  stage: publish
  script:
    - npm run health
    - npm run compile
    - npm run verify:release-approval
    - npm publish --access public
  variables:
    NPM_CONFIG_PROVENANCE: "true"
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/'
      when: manual
    - when: never
  environment:
    name: npm-production
